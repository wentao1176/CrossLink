services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crosslink
      POSTGRES_DB: crosslink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosslink -d crosslink"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://crosslink:${POSTGRES_PASSWORD}@postgres:5432/crosslink
      FILE_STORAGE_PATH: /data/files
      WEB_DIST_PATH: /app/web
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
    ports:
      - "127.0.0.1:8765:8000"
    volumes:
      - files-data:/data/files
      - ./client/build/web:/app/web:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    profiles: ["future-multiworker"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
volumes:
  postgres-data:
  files-data:
  redis-data:
